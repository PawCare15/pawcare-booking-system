<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2FA Verification - PawCare</title>

    <link rel="icon" href="image/logo.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <style>
        /* =========================================================
           2FA VERIFICATION - 样式 (同 reset-password 风格)
           ========================================================= */
        :root {
            --primary-color: #f9f9dd;
            --text-dark: #a75e31;
            --text-light: #af7957;
            --white: #ffffff;
            --btn-green: #3b7a57;
            --btn-green-hover: #2c5c41;
            --radius-lg: 24px;
            --radius-sm: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--primary-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        /* ===== 卡片 ===== */
        .verify-wrapper {
            width: 100%;
            max-width: 480px;
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: 0 12px 40px rgba(167, 94, 49, 0.12);
            padding: 2.5rem 2rem;
            text-align: center;
            transition: box-shadow 0.3s ease;
        }

        .verify-wrapper:hover {
            box-shadow: 0 20px 50px rgba(167, 94, 49, 0.20);
        }

        /* ===== Logo ===== */
        .verify-wrapper .logo-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .verify-wrapper .logo-wrap img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .verify-wrapper .logo-wrap .brand-name {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-dark);
        }

        .verify-wrapper .logo-wrap .brand-name small {
            display: block;
            font-size: 0.65rem;
            font-weight: 500;
            color: var(--text-light);
            text-transform: uppercase;
        }

        /* ===== 标题 ===== */
        .verify-wrapper h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.3rem;
        }

        .verify-wrapper .subtitle {
            color: var(--text-light);
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }

        .verify-wrapper .email-display {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f8f6f0;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-dark);
            margin-bottom: 1.8rem;
            border: 1px solid #ece6dc;
        }

        .verify-wrapper .email-display i {
            color: var(--text-light);
        }

        /* ===== 6位 OTP 输入框 ===== */
        .otp-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .otp-container .otp-box {
            width: 52px;
            height: 60px;
            text-align: center;
            font-size: 1.8rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            border: 2px solid #ece6dc;
            border-radius: var(--radius-sm);
            background: #fcfaf7;
            color: var(--text-dark);
            transition: all 0.3s ease;
            outline: none;
        }

        .otp-container .otp-box:focus {
            border-color: var(--text-dark);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(167, 94, 49, 0.06);
        }

        .otp-container .otp-box.filled {
            border-color: var(--btn-green);
            background: #f0f7f3;
        }

        /* ===== 错误消息 ===== */
        .error-message {
            color: #d32f2f;
            font-size: 0.82rem;
            margin-top: -0.5rem;
            margin-bottom: 1rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* ===== 验证按钮 ===== */
        .verify-wrapper .btn-verify {
            width: 100%;
            padding: 0.85rem;
            background: var(--btn-green);
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            color: var(--white);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(59, 122, 87, 0.25);
            margin-top: 0.5rem;
        }

        .verify-wrapper .btn-verify:hover {
            background: var(--btn-green-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(59, 122, 87, 0.35);
        }

        .verify-wrapper .btn-verify:active {
            transform: scale(0.96);
        }

        .verify-wrapper .btn-verify:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ===== 重新发送 ===== */
        .resend-section {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .resend-section .resend-link {
            color: var(--text-dark);
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .resend-section .resend-link:hover {
            color: var(--btn-green);
            text-decoration: underline;
        }

        .resend-section .countdown {
            color: #999;
            font-size: 0.85rem;
        }

        /* ===== 返回登录 ===== */
        .back-to-login {
            margin-top: 1.8rem;
            text-align: center;
        }

        .back-to-login .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dark);
            font-weight: 500;
            font-size: 0.92rem;
            text-decoration: none;
            padding: 0.6rem 1.4rem;
            border-radius: 50px;
            background: #f8f6f0;
            border: 1.5px solid #ece6dc;
            transition: all 0.3s ease;
        }

        .back-to-login .back-link i {
            font-size: 1.1rem;
            transition: transform 0.3s ease;
        }

        .back-to-login .back-link:hover {
            background: var(--text-dark);
            border-color: var(--text-dark);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(167, 94, 49, 0.20);
        }

        .back-to-login .back-link:hover i {
            transform: translateX(-3px);
        }

        /* ===== 自定义弹窗 ===== */
        .custom-popup-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            z-index: 99999;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .custom-popup-overlay.active {
            display: flex;
        }

        .custom-popup {
            background: #ffffff;
            max-width: 400px;
            width: 100%;
            padding: 2.5rem 2rem 2rem;
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.20);
            text-align: center;
            animation: popupSlideUp 0.35s ease;
        }

        @keyframes popupSlideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .popup-icon { font-size: 3.6rem; display: block; line-height: 1.2; }
        .popup-title { font-size: 1.4rem; font-weight: 700; color: #a75e31; margin-bottom: 0.5rem; }
        .popup-message { font-size: 0.95rem; color: #af7957; line-height: 1.7; margin-bottom: 1.6rem; }

        .popup-btn {
            width: 100%;
            padding: 0.85rem;
            background: #3b7a57;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(59, 122, 87, 0.25);
        }

        .popup-btn:hover {
            background: #2c5c41;
            transform: translateY(-2px);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .verify-wrapper {
                padding: 1.8rem 1.2rem;
            }
            .verify-wrapper h2 {
                font-size: 1.3rem;
            }
            .otp-container .otp-box {
                width: 42px;
                height: 50px;
                font-size: 1.4rem;
            }
            .otp-container {
                gap: 6px;
            }
        }
    </style>
</head>

<body>

    <div class="verify-wrapper">
        <!-- Logo -->
        <div class="logo-wrap">
            <img src="image/logo.png" alt="PawCare Logo">
            <div class="brand-name">
                PAW CARE
                <small>Booking System</small>
            </div>
        </div>

        <!-- 标题 -->
        <h2>🔐 Two-Factor Authentication</h2>
        <p class="subtitle">Please enter the 6-digit code sent to your registered email.</p>

        <!-- 邮箱显示 -->
        <div class="email-display">
            <i class="ri-mail-line"></i>
            <span id="emailDisplay">user***@gmail.com</span>
        </div>

        <!-- 6位 OTP 输入框 -->
        <div class="otp-container" id="otpContainer">
            <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]" autofocus>
            <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
        </div>

        <!-- 错误消息 -->
        <div class="error-message" id="otpError">Invalid code. Please try again.</div>

        <!-- 验证按钮 -->
        <button class="btn-verify" id="verifyBtn">🔑 Verify Code</button>

        <!-- 重新发送 -->
        <div class="resend-section">
            Didn't receive it? <a class="resend-link" id="resendLink">Resend Code</a>
            <span class="countdown" id="countdown"></span>
        </div>

        <!-- 返回登录 -->
        <div class="back-to-login">
            <a href="login.html" class="back-link">
                <i class="ri-arrow-left-line"></i> Back to Sign In
            </a>
        </div>
    </div>

    <!-- ===== 自定义弹窗 ===== -->
    <div class="custom-popup-overlay" id="customPopup">
        <div class="custom-popup">
            <div class="popup-icon" id="popupIcon">😊</div>
            <h3 class="popup-title" id="popupTitle">Title</h3>
            <p class="popup-message" id="popupMessage">Message</p>
            <button class="popup-btn" id="popupBtn">Got it!</button>
        </div>
    </div>

    <!-- ================================================================ -->
    <!-- JAVASCRIPT -->
    <!-- ================================================================ -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // ===== 自定义弹窗 =====
            function showPopup(icon, title, message, btnText = 'Got it!') {
                const overlay = document.getElementById('customPopup');
                document.getElementById('popupIcon').textContent = icon;
                document.getElementById('popupTitle').textContent = title;
                document.getElementById('popupMessage').textContent = message;
                document.getElementById('popupBtn').textContent = btnText;
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';

                document.getElementById('popupBtn').onclick = function() {
                    overlay.classList.remove('active');
                    document.body.style.overflow = '';
                };
                overlay.onclick = function(e) {
                    if (e.target === this) {
                        overlay.classList.remove('active');
                        document.body.style.overflow = '';
                    }
                };
            }

            // ===== DOM 引用 =====
            const otpBoxes = document.querySelectorAll('.otp-box');
            const verifyBtn = document.getElementById('verifyBtn');
            const emailDisplay = document.getElementById('emailDisplay');
            const otpError = document.getElementById('otpError');
            const resendLink = document.getElementById('resendLink');
            const countdownEl = document.getElementById('countdown');

            // ===== 从 localStorage 获取邮箱 =====
            const storedEmail = localStorage.getItem('2faEmail') || 'user***@gmail.com';
            emailDisplay.textContent = maskEmail(storedEmail);

            function maskEmail(email) {
                if (!email) return 'user***@gmail.com';
                const parts = email.split('@');
                const name = parts[0];
                const domain = parts[1] || 'gmail.com';
                if (name.length <= 2) return `${name}***@${domain}`;
                return `${name.substring(0, 3)}***@${domain}`;
            }

            // ===== OTP 输入自动跳转 =====
            otpBoxes.forEach((box, index) => {
                // 输入时自动跳转下一个
                box.addEventListener('input', function(e) {
                    const val = this.value;
                    // 只允许数字
                    if (!/^\d$/.test(val)) {
                        this.value = '';
                        return;
                    }
                    this.classList.add('filled');
                    // 跳转到下一个
                    if (index < otpBoxes.length - 1) {
                        otpBoxes[index + 1].focus();
                    }
                    // 清除错误
                    otpError.classList.remove('show');
                });

                // 键盘事件：Backspace 跳转到上一个
                box.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && this.value === '' && index > 0) {
                        otpBoxes[index - 1].focus();
                        otpBoxes[index - 1].classList.remove('filled');
                    }
                });

                // 粘贴支持
                box.addEventListener('paste', function(e) {
                    e.preventDefault();
                    const paste = (e.clipboardData || window.clipboardData).getData('text');
                    const digits = paste.replace(/\D/g, '').slice(0, 6);
                    if (digits.length > 0) {
                        // 填充所有框
                        const boxes = otpBoxes;
                        for (let i = 0; i < Math.min(digits.length, boxes.length); i++) {
                            boxes[i].value = digits[i];
                            boxes[i].classList.add('filled');
                        }
                        // 聚焦到最后一个填充的框的下一个
                        const nextIndex = Math.min(digits.length, boxes.length);
                        if (nextIndex < boxes.length) {
                            boxes[nextIndex].focus();
                        } else {
                            boxes[boxes.length - 1].focus();
                        }
                        otpError.classList.remove('show');
                    }
                });

                // 焦点时选中内容
                box.addEventListener('focus', function() {
                    this.select();
                });
            });

            // ===== 获取完整 OTP =====
            function getOtp() {
                let code = '';
                otpBoxes.forEach(box => code += box.value);
                return code;
            }

            // ===== 验证按钮点击 =====
            verifyBtn.addEventListener('click', async function() {
                const code = getOtp();

                if (code.length !== 6) {
                    otpError.textContent = 'Please enter the full 6-digit code.';
                    otpError.classList.add('show');
                    // 聚焦到第一个空框
                    for (let i = 0; i < otpBoxes.length; i++) {
                        if (otpBoxes[i].value === '') {
                            otpBoxes[i].focus();
                            break;
                        }
                    }
                    return;
                }

                // 禁用按钮
                verifyBtn.disabled = true;
                verifyBtn.innerHTML = '<i class="ri-loader-4-line ri-spin"></i> Verifying...';

                try {
                    const email = localStorage.getItem('2faEmail') || '';
                    const password = localStorage.getItem('2faPassword') || '';

                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: email,
                            password: password,
                            two_factor_code: code
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        // 登录成功
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.customer));
                        localStorage.setItem('isLoggedIn', 'true');

                        // 清除临时数据
                        localStorage.removeItem('2faEmail');
                        localStorage.removeItem('2faPassword');

                        showPopup('🎉', 'Welcome Back!', 'Login successful! Redirecting...');

                        const redirectUrl = data.customer.role === 'admin' ? 'admin_dashboard.html' : 'dashboard.html';
                        setTimeout(() => {
                            window.location.replace(redirectUrl);
                        }, 800);

                    } else {
                        // 验证失败
                        otpError.textContent = data.message || 'Invalid code. Please try again.';
                        otpError.classList.add('show');
                        // 清空 OTP 框
                        otpBoxes.forEach(box => {
                            box.value = '';
                            box.classList.remove('filled');
                        });
                        otpBoxes[0].focus();
                        verifyBtn.disabled = false;
                        verifyBtn.innerHTML = '🔑 Verify Code';
                    }

                } catch (error) {
                    console.error('2FA verification error:', error);
                    showPopup('❌', 'Network Error', 'Unable to connect to server. Please try again.');
                    verifyBtn.disabled = false;
                    verifyBtn.innerHTML = '🔑 Verify Code';
                }
            });

            // ===== Enter 键提交 =====
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const active = document.activeElement;
                    if (active && active.classList.contains('otp-box')) {
                        verifyBtn.click();
                    }
                }
            });

            // ===== 重新发送验证码 =====
            let countdownTimer = null;
            let countdownSeconds = 0;

            resendLink.addEventListener('click', function(e) {
                e.preventDefault();

                // 如果正在倒计时，不能点击
                if (countdownSeconds > 0) return;

                const email = localStorage.getItem('2faEmail') || '';

                if (!email) {
                    showPopup('⚠️', 'Error', 'Email not found. Please go back and login again.');
                    return;
                }

                // 禁用链接，显示发送中
                resendLink.textContent = 'Sending...';
                resendLink.style.pointerEvents = 'none';

                // 调用登录接口触发重新发送 2FA 邮件
                fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: localStorage.getItem('2faPassword') || '' })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.two_factor_required) {
                        showPopup('📨', 'Code Sent!', 'A new 2FA code has been sent to your email.');
                        // 开始倒计时 60 秒
                        startCountdown(60);
                    } else {
                        showPopup('❌', 'Error', 'Unable to resend code. Please try again.');
                    }
                })
                .catch(err => {
                    showPopup('❌', 'Network Error', 'Unable to connect to server.');
                })
                .finally(() => {
                    resendLink.textContent = 'Resend Code';
                    resendLink.style.pointerEvents = '';
                });
            });

            function startCountdown(seconds) {
                countdownSeconds = seconds;
                resendLink.style.pointerEvents = 'none';
                resendLink.style.color = '#999';
                countdownEl.textContent = `(${countdownSeconds}s)`;

                if (countdownTimer) clearInterval(countdownTimer);

                countdownTimer = setInterval(() => {
                    countdownSeconds--;
                    if (countdownSeconds <= 0) {
                        clearInterval(countdownTimer);
                        countdownTimer = null;
                        countdownEl.textContent = '';
                        resendLink.style.pointerEvents = '';
                        resendLink.style.color = '';
                    } else {
                        countdownEl.textContent = `(${countdownSeconds}s)`;
                    }
                }, 1000);
            }

            // ===== 自动聚焦第一个输入框 =====
            otpBoxes[0].focus();

            // ===== 如果页面刷新，检查是否有 email，没有则跳回登录 =====
            if (!localStorage.getItem('2faEmail')) {
                // 可能是直接访问页面，跳回登录
                // 但如果有 email 参数则使用
                const urlParams = new URLSearchParams(window.location.search);
                const emailFromUrl = urlParams.get('email');
                if (emailFromUrl) {
                    localStorage.setItem('2faEmail', emailFromUrl);
                    emailDisplay.textContent = maskEmail(emailFromUrl);
                } else {
                    // 没有 email，显示提示但允许用户手动返回
                    console.warn('No email found for 2FA verification.');
                }
            }

            console.log('🔐 2FA Verification page loaded.');
        });
    </script>

</body>

</html>
